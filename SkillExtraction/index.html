<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skill Ontology Graph (D3)</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto; }
    #toolbar { padding: 10px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; align-items: center; }
    #graph { width: 100vw; height: calc(100vh - 52px); }
    .hint { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <strong>Skill Ontology</strong>
    <span class="hint">Drag nodes • Scroll to zoom • Double click blank to reset</span>
    <label>Link strength: <input id="strength" type="range" min="0" max="1" step="0.05" value="0.3"></label>
  </div>
  <svg id="graph"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const svg = d3.select("#graph");
    const width = svg.node().clientWidth;
    const height = svg.node().clientHeight;

    const g = svg.append("g");

    const zoom = d3.zoom().scaleExtent([0.1, 6]).on("zoom", (event) => {
      g.attr("transform", event.transform);
    });
    svg.call(zoom);

    svg.on("dblclick", () => {
      svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
    });

    const tooltip = d3.select("body").append("div")
      .style("position", "fixed")
      .style("pointer-events", "none")
      .style("padding", "8px 10px")
      .style("background", "rgba(0,0,0,0.75)")
      .style("color", "white")
      .style("border-radius", "8px")
      .style("font-size", "12px")
      .style("display", "none");

    function colorByType(t) {
      if (t === "job") return "#1f77b4";
      if (t === "skill") return "#ff7f0e";
      return "#999";
    }

    function linkColor(type) {
      return type === "related_role" ? "#2ca02c" : "#999";
    }

    fetch("./skill_ontology_d3.json")
      .then(r => r.json())
      .then(data => {
        const nodes = data.nodes.map(d => ({...d}));
        const links = data.links.map(d => ({...d}));

        const nodeById = new Map(nodes.map(n => [n.id, n]));
        // Map link source/target from id strings to node objects (required by D3 forceLink).
        links.forEach(l => {
          l.source = nodeById.get(l.source);
          l.target = nodeById.get(l.target);
        });

        const link = g.append("g")
          .attr("stroke-opacity", 0.5)
          .selectAll("line")
          .data(links)
          .join("line")
          .attr("stroke", d => linkColor(d.type))
          .attr("stroke-width", d => d.type === "related_role" ? 1.5 : 1.0);

        const node = g.append("g")
          .selectAll("circle")
          .data(nodes)
          .join("circle")
          .attr("r", d => d.type === "job" ? 6 : 4)
          .attr("fill", d => colorByType(d.type))
          .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended)
          );

        node.on("mousemove", (event, d) => {
          const label = d.type === "job"
            ? `Job: ${d.title || d.job_id || d.id}`
            : `Skill: ${d.name || d.id}`;
          tooltip.style("display", "block")
            .style("left", (event.clientX + 12) + "px")
            .style("top", (event.clientY + 12) + "px")
            .text(label);
        }).on("mouseout", () => tooltip.style("display", "none"));

        const strengthInput = document.getElementById("strength");

        const sim = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(links).id(d => d.id).distance(d => d.type === "related_role" ? 120 : 60).strength(+strengthInput.value))
          .force("charge", d3.forceManyBody().strength(-80))
          .force("center", d3.forceCenter(width / 2, height / 2));

        strengthInput.addEventListener("input", () => {
          sim.force("link").strength(+strengthInput.value);
          sim.alpha(0.5).restart();
        });

        sim.on("tick", () => {
          link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

          node
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);
        });

        function dragstarted(event, d) {
          if (!event.active) sim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        }
        function dragged(event, d) {
          d.fx = event.x; d.fy = event.y;
        }
        function dragended(event, d) {
          if (!event.active) sim.alphaTarget(0);
          d.fx = null; d.fy = null;
        }
      });
  </script>
</body>
</html>
